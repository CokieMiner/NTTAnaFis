<title id="t">Multiplication time per limb and per coefficient, by target</title>
<desc id="d">AVX-512 IFMA target: at one million limbs ntt_anafis takes 43 ms, FLINT 61 ms, GMP 216 ms. AVX2 target: at one million limbs ntt_anafis takes 50 ms, FLINT 60 ms, GMP 216 ms. The README table repeats these values.</desc>
