<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 724" width="960" height="724" role="img" aria-labelledby="t d">
<title id="t">Multiplication time per limb and per coefficient, by target</title>
<desc id="d">AVX-512 IFMA target: at one million limbs ntt_anafis takes 43 ms, FLINT 61 ms, GMP 215 ms. AVX2 target: at one million limbs ntt_anafis takes 51 ms, FLINT 60 ms, GMP 215 ms. The README table repeats these values.</desc>
