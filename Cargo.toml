[package]
name = "ntt_anafis"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["CokieMiner"]
description = "Exact multi-prime number-theoretic transforms and native-limb multiplication"
license = "Apache-2.0"
repository = "https://github.com/CokieMiner/NTTAnaFis"
keywords = ["ntt", "multiplication", "bigint", "modular", "no-std"]
categories = ["mathematics", "algorithms", "no-std"]
exclude = [".github/", ".gitignore", "AGENTS.md", "docs/", "tools/"]

[features]
default = ["std"]
# Selects kernels at run time; without it the target features fix them.
std = []
# Runs large operations in the active Rayon pool.
rayon = ["std", "core_anafis/rayon"]

[dependencies]
core_anafis = { path = "../CoreAnaFis", version = "0.1.0" }

[dev-dependencies]
rayon = { version = "1.12.0", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1.12.0"

# WASI has no processes for the default `fork` and `timeout` features.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(miri)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
integer_division = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
